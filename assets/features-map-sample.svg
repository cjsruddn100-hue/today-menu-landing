<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="추천 결과가 지도에 표시된 예시 화면">
  <defs>
    <clipPath id="mapClip"><rect x="0" y="0" width="720" height="420" rx="16" /></clipPath>
  </defs>

  <g clip-path="url(#mapClip)">
    <rect width="720" height="420" fill="#f3efe7" />

    <!-- 블록 -->
    <g fill="#e9e3d6">
      <rect x="40" y="40" width="180" height="120" rx="8" />
      <rect x="260" y="40" width="150" height="120" rx="8" />
      <rect x="450" y="40" width="230" height="90" rx="8" />
      <rect x="40" y="210" width="140" height="170" rx="8" />
      <rect x="220" y="240" width="190" height="140" rx="8" />
      <rect x="450" y="180" width="230" height="200" rx="8" />
    </g>

    <!-- 도로 -->
    <g stroke="#ffffff" stroke-linecap="round">
      <path d="M0 185 H720" stroke-width="22" />
      <path d="M235 0 V420" stroke-width="18" />
      <path d="M430 0 V420" stroke-width="14" />
      <path d="M0 400 H720" stroke-width="12" />
    </g>

    <!-- 하천 -->
    <path d="M-20 320 C 140 300, 220 360, 380 330 S 620 300, 740 340" fill="none" stroke="#dbe7e4" stroke-width="16" />

    <!-- 반경 표시 -->
    <circle cx="330" cy="210" r="120" fill="#f97316" fill-opacity="0.07" stroke="#f97316" stroke-opacity="0.35" stroke-dasharray="6 6" />

    <!-- 현재 위치 -->
    <circle cx="330" cy="210" r="16" fill="#2563eb" fill-opacity="0.15" />
    <circle cx="330" cy="210" r="6" fill="#2563eb" />

    <!-- 추천 마커 -->
    <g transform="translate(404 122)">
      <ellipse cx="0" cy="62" rx="14" ry="5" fill="#000" fill-opacity="0.15" />
      <path d="M0 60 C0 60 26 32 26 18 A26 26 0 1 0 -26 18 C-26 32 0 60 0 60 Z" fill="#f97316" />
      <circle cx="0" cy="18" r="9" fill="#fff" />
    </g>

    <!-- 결과 말풍선 -->
    <g transform="translate(360 30)">
      <rect x="0" y="0" width="286" height="78" rx="14" fill="#ffffff" />
      <rect x="0.5" y="0.5" width="285" height="77" rx="13.5" fill="none" stroke="#e8e3da" />
      <text x="20" y="31" font-family="'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#130f09">오늘은 여기 어때요?</text>
      <text x="20" y="57" font-family="'Noto Sans KR', sans-serif" font-size="14" fill="#6b6557">회사에서 220m · 도보 3분</text>
      <circle cx="262" cy="27" r="13" fill="#fff4ec" />
      <text x="262" y="32" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="13">🎲</text>
    </g>

    <!-- 주변 후보 점 -->
    <g fill="#c9c1b1">
      <circle cx="250" cy="150" r="5" />
      <circle cx="286" cy="286" r="5" />
      <circle cx="398" cy="268" r="5" />
      <circle cx="224" cy="236" r="5" />
    </g>
  </g>

  <rect x="0.5" y="0.5" width="719" height="419" rx="16" fill="none" stroke="#e8e3da" />
</svg>
